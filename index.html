<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<meta name="generator" content="Hostinger Horizons" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Nouveau Concept CRM</title>

		<!-- PWA -->
		<meta name="theme-color" content="#2563eb" />
		<meta name="application-name" content="NC CRM" />
		<meta name="description" content="Gestion de flotte et réservations — Nouveau Concept" />

		<!-- iOS / iPadOS -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="NC CRM" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			(function() {
				var theme = localStorage.getItem('theme');
				if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<div id="thermal-receipt"></div>
		<script type="module" src="/src/main.jsx"></script>

		<style>
			#thermal-receipt { display: none; }

			@media print {
				#root { display: none !important; }
				#thermal-receipt {
					display: block !important;
					font-family: 'Courier New', Courier, monospace;
					font-size: 12px;
					line-height: 1.5;
					width: 64mm;
					margin: 0;
					padding: 2mm;
					box-sizing: border-box;
					color: #000;
					background: #fff;
				}
			}
		</style>
	</body>
</html>
